[project]
name = "autoviziq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Insiya Zaveri", email = "insiya.zaveri.bba2025@saii.siu.edu.in" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "reflex>=0.9.12",
    "seaborn>=0.13.2",
]

[project.scripts]
autoviziq = "autoviziq:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
